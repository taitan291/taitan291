    <rect x="235.76" y="52" width="115.62" height="10" fill="#dea584"/>
    <rect x="351.38" y="52" width="60.63" height="10" fill="#000080"/>
    <rect x="412.02" y="52" width="24.95" height="10" fill="#8b949e"/>
