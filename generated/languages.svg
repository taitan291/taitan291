<svg xmlns="http://www.w3.org/2000/svg" width="495" height="225" viewBox="0 0 495 225" role="img" aria-labelledby="title">
  <title id="title">Top Languages: Rust 37.1%, Nix 17.2%, QML 14.3%, Go 10.8%, Typst 6.6%, CSS 5.6%, Lua 3.0%, JavaScript 2.4%, Other 3.1%</title>
  <style>
    :root { --bg: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #656d76; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --border: #30363d; --text: #e6edf3; --muted: #8d96a0; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: var(--text); }
    .name { font-size: 13px; fill: var(--text); }
    .pct { font-size: 13px; fill: var(--muted); }
  </style>
  <rect x="0.5" y="0.5" width="494" height="224" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text class="title" x="25" y="35">Top Languages</text>
  <clipPath id="bar"><rect x="25" y="52" width="445" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="25.00" y="52" width="165.31" height="10" fill="#dea584"/>
    <rect x="190.31" y="52" width="76.46" height="10" fill="#7e7eff"/>
    <rect x="266.77" y="52" width="63.44" height="10" fill="#44a51c"/>
    <rect x="330.20" y="52" width="47.87" height="10" fill="#00ADD8"/>
    <rect x="378.07" y="52" width="29.49" height="10" fill="#239dad"/>
    <rect x="407.56" y="52" width="24.92" height="10" fill="#563d7c"/>
    <rect x="432.48" y="52" width="13.16" height="10" fill="#000080"/>
    <rect x="445.63" y="52" width="10.78" height="10" fill="#f1e05a"/>
    <rect x="456.42" y="52" width="13.58" height="10" fill="#8b949e"/>
  </g>
  <circle cx="30" cy="91" r="5" fill="#dea584"/>
  <text class="name" x="41" y="95">Rust</text>
  <text class="pct" x="225" y="95" text-anchor="end">37.1%</text>
  <circle cx="260" cy="91" r="5" fill="#7e7eff"/>
  <text class="name" x="271" y="95">Nix</text>
  <text class="pct" x="455" y="95" text-anchor="end">17.2%</text>
  <circle cx="30" cy="116" r="5" fill="#44a51c"/>
  <text class="name" x="41" y="120">QML</text>
  <text class="pct" x="225" y="120" text-anchor="end">14.3%</text>
  <circle cx="260" cy="116" r="5" fill="#00ADD8"/>
  <text class="name" x="271" y="120">Go</text>
  <text class="pct" x="455" y="120" text-anchor="end">10.8%</text>
  <circle cx="30" cy="141" r="5" fill="#239dad"/>
  <text class="name" x="41" y="145">Typst</text>
  <text class="pct" x="225" y="145" text-anchor="end">6.6%</text>
  <circle cx="260" cy="141" r="5" fill="#563d7c"/>
  <text class="name" x="271" y="145">CSS</text>
  <text class="pct" x="455" y="145" text-anchor="end">5.6%</text>
  <circle cx="30" cy="166" r="5" fill="#000080"/>
  <text class="name" x="41" y="170">Lua</text>
  <text class="pct" x="225" y="170" text-anchor="end">3.0%</text>
  <circle cx="260" cy="166" r="5" fill="#f1e05a"/>
  <text class="name" x="271" y="170">JavaScript</text>
  <text class="pct" x="455" y="170" text-anchor="end">2.4%</text>
  <circle cx="30" cy="191" r="5" fill="#8b949e"/>
  <text class="name" x="41" y="195">Other</text>
  <text class="pct" x="225" y="195" text-anchor="end">3.1%</text>
