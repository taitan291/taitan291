    <rect x="458.93" y="52" width="4.97" height="10" fill="#e34c26"/>
    <rect x="463.89" y="52" width="3.86" height="10" fill="#f1e05a"/>
    <rect x="467.75" y="52" width="2.25" height="10" fill="#8b949e"/>
  </g>
  <circle cx="30" cy="91" r="5" fill="#7e7eff"/>
  <text class="name" x="41" y="95">Nix</text>
  <text class="pct" x="225" y="95" text-anchor="end">47.4%</text>
  <circle cx="260" cy="91" r="5" fill="#dea584"/>
