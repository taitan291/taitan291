<svg xmlns="http://www.w3.org/2000/svg" width="495" height="225" viewBox="0 0 495 225" role="img" aria-labelledby="title">
  <title id="title">Top Languages: Nix 42.7%, Rust 23.4%, Lua 12.3%, JavaScript 10.6%, Astro 5.1%, CSS 3.4%, Emacs Lisp 1.1%, HTML 1.0%, Other 0.5%</title>
  <style>
    :root { --bg: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #656d76; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --border: #30363d; --text: #e6edf3; --muted: #8d96a0; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: var(--text); }
    .name { font-size: 13px; fill: var(--text); }
    .pct { font-size: 13px; fill: var(--muted); }
  </style>
  <rect x="0.5" y="0.5" width="494" height="224" rx="6" fill="var(--bg)" stroke="var(--border)"/>
  <text class="title" x="25" y="35">Top Languages</text>
  <clipPath id="bar"><rect x="25" y="52" width="445" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
