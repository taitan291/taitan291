    <rect x="192.96" y="52" width="70.92" height="10" fill="#3178c6"/>
    <rect x="263.88" y="52" width="50.39" height="10" fill="#7e7eff"/>
    <rect x="314.27" y="52" width="41.95" height="10" fill="#ff3e00"/>
    <rect x="356.23" y="52" width="33.32" height="10" fill="#44a51c"/>
    <rect x="389.54" y="52" width="25.47" height="10" fill="#00ADD8"/>
    <rect x="415.01" y="52" width="16.80" height="10" fill="#563d7c"/>
    <rect x="431.81" y="52" width="15.69" height="10" fill="#239dad"/>
    <rect x="447.50" y="52" width="22.50" height="10" fill="#8b949e"/>
  </g>
  <circle cx="30" cy="91" r="5" fill="#dea584"/>
  <text class="name" x="41" y="95">Rust</text>
  <text class="pct" x="225" y="95" text-anchor="end">37.7%</text>
  <circle cx="260" cy="91" r="5" fill="#3178c6"/>
  <text class="name" x="271" y="95">TypeScript</text>
  <text class="pct" x="455" y="95" text-anchor="end">15.9%</text>
  <circle cx="30" cy="116" r="5" fill="#7e7eff"/>
  <text class="name" x="41" y="120">Nix</text>
  <text class="pct" x="225" y="120" text-anchor="end">11.3%</text>
  <circle cx="260" cy="116" r="5" fill="#ff3e00"/>
  <text class="name" x="271" y="120">Svelte</text>
  <text class="pct" x="455" y="120" text-anchor="end">9.4%</text>
  <circle cx="30" cy="141" r="5" fill="#44a51c"/>
  <text class="name" x="41" y="145">QML</text>
  <text class="pct" x="225" y="145" text-anchor="end">7.5%</text>
  <circle cx="260" cy="141" r="5" fill="#00ADD8"/>
  <text class="name" x="271" y="145">Go</text>
  <text class="pct" x="455" y="145" text-anchor="end">5.7%</text>
