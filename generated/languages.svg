<svg xmlns="http://www.w3.org/2000/svg" width="495" height="225" viewBox="0 0 495 225" role="img" aria-labelledby="title">
  <title id="title">Top Languages: Rust 61.1%, Nix 23.6%, Lua 6.0%, JavaScript 4.4%, Astro 2.4%, CSS 1.6%, HTML 0.5%, Shell 0.2%, Other 0.1%</title>
  <style>
    :root { --bg: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #656d76; }
