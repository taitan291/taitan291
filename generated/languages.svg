    <rect x="458.74" y="52" width="4.76" height="10" fill="#c065db"/>
    <rect x="463.49" y="52" width="4.48" height="10" fill="#e34c26"/>
    <rect x="467.97" y="52" width="2.03" height="10" fill="#8b949e"/>
  </g>
  <circle cx="30" cy="91" r="5" fill="#7e7eff"/>
  <text class="name" x="41" y="95">Nix</text>
  <text class="pct" x="225" y="95" text-anchor="end">42.7%</text>
  <circle cx="260" cy="91" r="5" fill="#dea584"/>
