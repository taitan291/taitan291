  <circle cx="260" cy="166" r="5" fill="#f1e05a"/>
  <text class="name" x="271" y="170">JavaScript</text>
  <text class="pct" x="455" y="170" text-anchor="end">2.4%</text>
  <circle cx="30" cy="191" r="5" fill="#8b949e"/>
  <text class="name" x="41" y="195">Other</text>
  <text class="pct" x="225" y="195" text-anchor="end">3.2%</text>
